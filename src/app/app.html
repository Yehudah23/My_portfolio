
<div class="os-shell" [ngClass]="{'dark-mode': isDarkMode}">
  <header class="system-bar">
    <a class="system-brand" routerLink="/" aria-label="King Judah home">
      <span class="brand-mark">KJ</span>
      <span class="brand-copy"><strong>King Judah</strong><small>creative systems</small></span>
    </a>
    <div class="system-status"><span class="status-dot"></span> Available for select work <span class="status-divider"></span> {{ currentTime }}</div>
    <button class="system-menu" type="button" (click)="isDarkMode = !isDarkMode" [attr.aria-label]="isDarkMode ? 'Use light theme' : 'Use dark theme'">
      <i class="bi" [ngClass]="isDarkMode ? 'bi-sun' : 'bi-moon-stars'"></i>
    </button>
  </header>

  <aside class="workspace-sidebar" aria-label="Portfolio navigation">
    <div class="sidebar-label">Workspace</div>
    <nav>
      <a *ngFor="let link of workspaceLinks" [routerLink]="link.path" [fragment]="link.fragment" routerLinkActive="active" [routerLinkActiveOptions]="{exact: link.exact}" class="workspace-link">
        <i class="bi" [ngClass]="link.icon"></i><span>{{ link.label }}</span>
      </a>
    </nav>
    <div class="sidebar-note"><span class="note-icon"><i class="bi bi-stars"></i></span><span><small>Currently building</small><strong>Useful things<br>for the web.</strong></span></div>
  </aside>

  <main class="workspace-main"><div class="workspace-crumb"><span>~/portfolio</span><span class="crumb-slash">/</span><span>dashboard</span><span class="live-pill"><span></span> live</span></div><div class="router-frame"><router-outlet></router-outlet></div></main>

  <nav class="mobile-dock" aria-label="Mobile portfolio navigation">
    <a *ngFor="let link of workspaceLinks" [routerLink]="link.path" [fragment]="link.fragment" routerLinkActive="active" [routerLinkActiveOptions]="{exact: link.exact}"><i class="bi" [ngClass]="link.icon"></i><small>{{ link.label }}</small></a>
  </nav>
</div>

<!-- Back to top button -->
<button class="btn btn-primary back-to-top-btn"
        [ngClass]="{'show': showBackToTop}"
        (click)="scrollToTop()"
        aria-label="Back to top">
  <i class="bi bi-arrow-up"></i>
</button>

<style>
  .back-to-top-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    z-index: 1000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  .back-to-top-btn.show {
    opacity: 1;
    visibility: visible;
  }

  .back-to-top-btn:hover {
    transform: translateY(-5px);
  }

  @media (max-width: 768px) {
    .social-sidebar { display: none; }
  }
</style>
